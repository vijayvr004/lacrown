# ==============================================================================
# Render Infrastructure Blueprint
# Auto-deploys the La Crown Node.js REST API on Render.com
# ==============================================================================

services:
  - type: web
    name: lacrown-backend
    runtime: node
    plan: free
    region: oregon # or frankfurt, singapore
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
        # Paste your Neon PostgreSQL connection string here in the Render dashboard:
        # postgresql://user:password@ep-name.us-east-2.aws.neon.tech/neondb?sslmode=require
      - key: RESEND_API_KEY
        sync: false
        # Paste your Resend API Key (re_...) here
      - key: MANAGER_EMAIL
        value: lacrownaesthetics1111@gmail.com
      - key: EMAIL_FROM
        value: "La Crown Concierge <onboarding@resend.dev>"
      - key: CLIENT_ORIGIN
        value: https://lacrown-pink.vercel.app
      - key: ADMIN_SECRET_KEY
        generateValue: true
